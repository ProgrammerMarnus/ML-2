# HISTORICAL PROXY ONLY — DO NOT EXECUTE AS H-002.
# This single-target synthetic OHLCV configuration does not meet H-002's
# preregistered Russell 3000, intraday trade-classification, market-cap, VIX,
# or dollar-neutral cross-sectional portfolio contract. The runtime refuses it.

data:
  mode: synthetic
  assets: [SPY, QQQ, AAPL, MSFT, JPM, GLD, TLT]
  target: SPY
  start: "2012-01-01"
  end: "2026-01-01"
  frequency: 1d
  exchange_calendar: XNYS
  csv_path: null
  raw_snapshot_dir: data/raw_snapshots

evaluation:
  train_window: 1260
  validation_window: 252
  test_window: 252
  step_bars: 252
  purge_bars: 5
  embargo_bars: 5
  expanding: true

execution:
  fee_bps: 5.0
  slippage_bps: 1.0
  signal_delay_bars: 0
  target_vol: 0.10
  max_position: 1.0

model:
  type: logistic
  random_seed: 42
  logreg_C: 0.1
  hold_bars: 3

features:
  include_sources:
    - liquidity_reversal
    - price_volume
  exclude_features: []

research:
  max_trials: 10
  bootstrap_samples: 50
  placebo_runs: 20
  threshold_candidates: [0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  hold_candidates: [5, 10, 15, 20]

promotion:
  min_median_oos_sharpe: 0.0
  min_mean_oos_sharpe: 0.0
  max_oos_dd: -0.50
  cost_stress_fee_bps: 10.0
  delay_stress_bars: 1
  min_bootstrap_positive_prob: 0.80
  min_placebo_percentile: 0.95
  max_single_fold_share: 0.60
  max_annual_turnover: 60.0
